[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexus-memory"
version = "0.1.0"
description = "Local-first, cross-agent AI memory system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tansi", email = "bozoinc@proton.me"}
]
keywords = ["ai", "agent", "memory", "local-first", "cross-agent", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
nexus = "nexus:main"
nexus-mcp = "nexus_mcp.server:main"

[project.urls]
Homepage = "https://github.com/bozoinc/nexus-memory"
Repository = "https://github.com/bozoinc/nexus-memory"
Issues = "https://github.com/bozoinc/nexus-memory/issues"
